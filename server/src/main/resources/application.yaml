server:
  port: 8080
  servlet:
    context-path: /abtechzone

spring:
  application:
    name: ABTechZone
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      url: ${REDIS_ADDRESS:redis://localhost:3308}

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 86400 # in second
  refreshable-duration: 259200 #seconds

open:
  api:
    title: ABTechZone API
    version: v1.0.0
    description: RESTful API documentation for ABTechZone e-commerce platform
    serverUrl: http://localhost:8080/abtechzone
    serverName: ABTechZone Local Server

app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@abtechzone.com}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
  shipping:
    ghn:
      enabled: ${GHN_SHIPPING_ENABLED:true}
      base-url: ${GHN_SHIPPING_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
      token: ${GHN_SHIPPING_TOKEN:}
      shop-id: ${GHN_SHIPPING_SHOP_ID:0}
      from-district-id: ${GHN_SHIPPING_FROM_DISTRICT_ID:0}
      from-ward-code: ${GHN_SHIPPING_FROM_WARD_CODE:}
      fixed-weight-gram: ${GHN_SHIPPING_FIXED_WEIGHT_GRAM:500}
      service-type-id: ${GHN_SHIPPING_SERVICE_TYPE_ID:2}
      connect-timeout-seconds: ${GHN_SHIPPING_CONNECT_TIMEOUT_SECONDS:5}
      request-timeout-seconds: ${GHN_SHIPPING_REQUEST_TIMEOUT_SECONDS:10}
      location-cache-ttl-seconds: ${GHN_SHIPPING_LOCATION_CACHE_TTL_SECONDS:86400}
  payment:
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
    online:
      deadline-minutes: ${PAYMENT_DEADLINE_MINUTES:15}
      max-queries: ${PAYMENT_MAX_QUERIES:96}
      query-window-hours: ${PAYMENT_QUERY_WINDOW_HOURS:24}
      return-base-url: ${PAYMENT_RETURN_BASE_URL:http://localhost:3000}
      gateways:
        MOMO:
          enabled: ${MOMO_ENABLED:false}
          merchant-id: ${MOMO_PARTNER_CODE:}
          access-key: ${MOMO_ACCESS_KEY:}
          secret-key: ${MOMO_SECRET_KEY:}
          callback-url: ${MOMO_CALLBACK_URL:}
          api-url: https://test-payment.momo.vn/v2/gateway/api
        VNPAY:
          enabled: ${VNPAY_ENABLED:false}
          merchant-id: ${VNPAY_TMN_CODE:}
          secret-key: ${VNPAY_HASH_SECRET:}
          callback-url: ${VNPAY_CALLBACK_URL:}
          api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
          checkout-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
        PAYOS:
          enabled: ${PAYOS_ENABLED:false}
          merchant-id: ${PAYOS_CLIENT_ID:}
          access-key: ${PAYOS_API_KEY:}
          secret-key: ${PAYOS_CHECKSUM_KEY:}
          callback-url: ${PAYOS_CALLBACK_URL:}
          api-url: https://api-merchant.payos.vn

springdoc:
  swagger-ui:
    enabled: ${app.swagger.enabled:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: ${app.swagger.enabled:true}
    path: /api-docs

aws:
  region: ${AWS_REGION:ap-northeast-1}
  access-key: ${AWS_BUCKET_ACCESS_KEY}
  secret-key: ${AWS_BUCKET_SECRET_KEY}
  s3:
    bucket: ${AWS_BUCKET_NAME}

cloudfront:
  url: ${CLOUDFRONT_URL:}
  key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID:}
  private-key: ${CLOUDFRONT_PRIVATE_KEY:}
  signed-url-expiration-days: 7
